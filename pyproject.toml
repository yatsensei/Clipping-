[project]
name = "clipping"
version = "0.1.0"
description = "Physics-informed optimiser for 2026 F1 electrical deployment strategy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastf1>=3.8.3",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "pyarrow>=25.0.0",
    "scipy>=1.17.1",
]

[tool.pytest.ini_options]
# Run from the repo root so `config`, `data` and `physics` import as top-level packages,
# matching how the scripts are invoked (python -m scripts.*).
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pypdf>=6.15.0",
    "pytest>=9.1.1",
]
